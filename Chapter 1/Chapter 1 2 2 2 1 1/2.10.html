<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Sinful Nightmare - Chapter 1</title>

    <link rel="stylesheet" href="2.10.css" />
    <script src="2.10.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="sceneContainer" class="text-center p-6 max-w-lg mx-auto">
      <h1 class="text-5xl mb-8 text-red-600 red-glow"></h1>

      <div
        class="bg-gray-900 py-4 px-8 rounded-xl border-2 border-red-900 shadow-2xl"
      >
        You pull away, your mind reeling. Chloe's frantic reaction and
        insistence on secrecy are just as frightening as the text itself. You
        have a vital piece of information—a killer is watching you, possibly
        right here in the school—and your closest friend just ordered you to
        keep it a secret.
      </div>

      <div class="mt-10 space-y-4">
        <button
          id="confrontButton"
          class="w-full px-8 py-4 text-lg font-bold rounded-lg border-2 border-red-600 bg-red-800 hover:bg-red-800 transition duration-300 transform shadow-lg"
        >
          CONFRONT CHLOE DIRECTLY
        </button>

        <button
          id="agreeButton"
          class="w-full px-8 py-4 text-lg font-bold rounded-lg border-2 border-red-600 bg-red-800 hover:bg-red-800 transition duration-300 transform shadow-lg"
        >
          AGREE FOR NOW BUT TELL ANOTHER FRIEND
        </button>
      </div>
    </div>
  </body>
</html>
